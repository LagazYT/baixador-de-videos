<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 300px; margin: 0; padding: 14px; font: 13px system-ui, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: none; }
  .dot.ok { background: #22c55e; } .dot.off { background: #ef4444; }
  button { width: 100%; height: 36px; border: 0; border-radius: 10px; background: #7c3aed; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  .hint { color: #6b7280; font-size: 12px; margin-top: 8px; }
  .foot { margin-top: 12px; font-size: 11px; color: #6b7280; }
</style>
</head>
<body>
  <h1>Baixador de Vídeos</h1>
  <div class="row"><span class="dot" id="dot"></span><span id="status">Verificando...</span></div>
  <label class="row"><input type="checkbox" id="auto" checked> Sugerir downloads automaticamente</label>
  <button id="send" disabled>Baixar a página atual</button>
  <div class="hint" id="hint"></div>
  <div class="foot">Produzido por Lagaz • tudo fica no seu computador</div>
  <script src="popup.js"></script>
</body>
</html>
