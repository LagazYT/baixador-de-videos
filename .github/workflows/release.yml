name: Gerar instalador

# Roda a cada mudança no app desktop, numa tag v* ou manualmente pela aba Actions.
# Para publicar o instalador na página de downloads, inclua [publicar] na mensagem do commit.
# (o instalador de cada versão também fica como artefato da execução)
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["app.py", "arte*.py", "requirements.txt", "installer.iss", "extensao_navegador/**", "ci/**", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Definir versão
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = (Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Get-Content app.py -Raw -Encoding UTF8) -replace 'APP_VERSION = "[^"]*"', "APP_VERSION = `"$v`"" |
            Set-Content app.py -Encoding UTF8 -NoNewline

      - name: Instalar dependências
        id: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Gerar ícones e imagens
        run: python arte.py

      - name: Gerar o programa (PyInstaller)
        id: pyinstaller
        run: >
          python -m PyInstaller --noconfirm --clean --noconsole --onedir
          --name BaixadorDeVideos
          --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-all customtkinter
          --collect-all imageio_ffmpeg --collect-all pystray
          --hidden-import mpv --collect-all py7zr
          --icon icone.ico app.py

      - name: Incluir o Deno (exigido pelo YouTube)
        id: deno
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno -Force
          Copy-Item deno\deno.exe dist\BaixadorDeVideos\

      - name: Incluir o player de vídeo (libmpv)
        id: libmpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "ci" } -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*-v3-*" } | Select-Object -First 1
          if (-not $asset) { throw "libmpv nao encontrado" }
          Invoke-WebRequest -UseBasicParsing -Uri $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv -y | Out-Null
          $dll = Get-ChildItem -Recurse mpv -Include libmpv-2.dll, mpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll nao encontrado no pacote" }
          Copy-Item $dll.FullName dist\BaixadorDeVideos\
          Get-Item "dist\BaixadorDeVideos\$($dll.Name)"

      - name: Instalar o Inno Setup
        id: inno
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Montar o instalador
        id: installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer.iss'

      - name: Guardar o instalador (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: BaixadorDeVideos_Setup
          path: installer_output/BaixadorDeVideos_Setup.exe

      - name: Publicar na página de Releases
        if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[publicar]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Baixador de Vídeos ${{ env.VERSION }}
          make_latest: true
          files: installer_output/BaixadorDeVideos_Setup.exe
          body: |
            ## Como instalar

            1. Baixe o arquivo **BaixadorDeVideos_Setup.exe** logo abaixo, em *Assets*.
            2. Dê dois cliques e siga o assistente. Se já tiver uma versão anterior, ele atualiza por cima e mantém o histórico e as configurações.

            Se o Windows mostrar "O Windows protegeu seu computador", clique em **Mais informações** e depois em **Executar assim mesmo**.

            ## Novidades da ${{ env.VERSION }}

            **Correção da 1.6.1:** o "Baixar só um trecho" falhava no Windows com "Requested format is not available" (o programa não achava o FFmpeg para baixar só a parte escolhida). Agora funciona e, se baixar só o trecho não der certo, o programa baixa o vídeo e corta o trecho no próprio computador. As mensagens de erro também mostram a causa real.

            As opções novas da 1.6 ficam na gaveta **Mais opções** da aba Baixar, que começa fechada: sem mexer nela, o download funciona como antes.

            - **Compatível com editores (MP4 H.264):** O vídeo sai em H.264 + AAC, que abre no Premiere, Vegas, CapCut, DaVinci e em qualquer celular. Quando o vídeo não tem H.264 na qualidade escolhida (4K no YouTube, por exemplo), o programa converte depois do download.
            - **Baixar só um trecho:** marque a opção, escolha o início e o fim (ex.: 2:15 a 3:40) e baixe só aquela parte, em vídeo ou MP3. O vídeo inteiro continua sendo o padrão. Há a opção de corte exato (mais lento).
            - **Legendas:** escolha a legenda do vídeo; ela vem embutida no MP4 e também como arquivo .srt.
            - **Salvar thumbnail:** salva a capa do vídeo em alta resolução (JPG) na pasta de downloads.
            - **Relatório de erro:** em ⚙ › Problemas? e nas mensagens de erro, um botão copia as informações que ajudam a descobrir a causa de uma falha.

            > Quem está na 1.4.0 ou 1.5.0 recebe esta versão pela atualização automática. Quem está na 1.3.0 ou anterior instala manualmente uma vez.

            📱 A versão para Android (beta) está na [página da versão Android](https://github.com/${{ github.repository }}/releases/tag/android-v${{ env.VERSION }}).

            Produzido por Lagaz.

      - name: Capturas de tela (diagnóstico)
        id: shots
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\appdata
          PYTHONIOENCODING: utf-8
        run: |
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          foreach ($st in "classico", "steampunk") { $env:SHOT_STYLE = $st; python ci/ui_shots.py shots }

      - name: Teste real no YouTube (diagnóstico)
        id: smoke
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\appdata
          PYTHONIOENCODING: utf-8
        run: |
          if (Test-Path deno\deno.exe) { $env:PATH = "$PWD\deno;$env:PATH" }
          python ci/youtube_smoke.py smoke *>&1 | Tee-Object -FilePath smoke.txt

      - name: Publicar o log (diagnóstico)
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          echo "${{ job.status }} run=${{ github.run_number }} ref=${{ github.ref }} sha=${{ github.sha }}" > status.txt
          cat > steps.json << 'JSONEOF'
          ${{ toJSON(steps) }}
          JSONEOF
          ls -la "$GITHUB_WORKSPACE/installer_output" > installer.txt 2>&1 || true
          ls -la "$GITHUB_WORKSPACE/dist/BaixadorDeVideos" > dist.txt 2>&1 || true
          cp -r "$GITHUB_WORKSPACE/shots" . 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/smoke.txt" . 2>/dev/null || true
          git init -q -b ci-logs-desktop
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-desktop
