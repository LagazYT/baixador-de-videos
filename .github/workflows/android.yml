name: Gerar APK (Android)

# Roda a cada mudança na pasta android/ (ou neste arquivo). Para publicar o APK na página
# de downloads (como pré-lançamento android-v<versão>), inclua [publicar] na mensagem do commit.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        id: gradle
        with:
          gradle-version: "8.11.1"

      - name: Chave de assinatura
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
              echo "ANDROID_KEY_ALIAS=baixador"
              echo "ANDROID_KEY_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
            echo "Assinando com a chave do projeto."
          else
            echo "::warning::Sem chave do projeto: o APK sera assinado com uma chave temporaria."
          fi

      - name: Compilar
        id: build
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          set -o pipefail
          gradle assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Preparar os APKs
        id: apks
        run: |
          mkdir -p apks
          V=$(cat android/VERSION)
          for f in android/app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f")
            case "$n" in
              *arm64-v8a*) cp "$f" "apks/BaixadorDeVideos-Android-$V-arm64.apk" ;;
              *armeabi-v7a*) cp "$f" "apks/BaixadorDeVideos-Android-$V-armv7.apk" ;;
              *x86_64*) cp "$f" "apks/BaixadorDeVideos-Android-$V-x86_64.apk" ;;
            esac
          done
          ls -la apks
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: BaixadorDeVideos-Android
          path: apks/*.apk

      - name: Publicar o log da compilação (ajuda a corrigir erros)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs" && cd "$RUNNER_TEMP/logs"
          cp "$GITHUB_WORKSPACE/android/build.log" build.log 2>/dev/null || echo "sem log" > build.log
          ls -la "$GITHUB_WORKSPACE/apks" > apks.txt 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          cat > steps.json << 'JSONEOF'
          ${{ toJSON(steps) }}
          JSONEOF
          java -version >> status.txt 2>&1 || true
          which gradle sdkmanager >> status.txt 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> status.txt
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

      - name: Guardar o APK num ramo (para baixar fora do GitHub)
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/apkbranch" && cd "$RUNNER_TEMP/apkbranch"
          cp "$GITHUB_WORKSPACE"/apks/*-arm64.apk "$GITHUB_WORKSPACE"/apks/*-armv7.apk .
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "APK ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk

      - name: Publicar na página de downloads (beta)
        if: success() && contains(github.event.head_commit.message, '[publicar]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ steps.apks.outputs.version }}
          name: Baixador de Vídeos para Android ${{ steps.apks.outputs.version }} (beta)
          prerelease: true
          make_latest: false
          files: apks/*.apk
          body: |
            ## 📱 Baixador de Vídeos para Android (beta)

            Os mesmos recursos da versão para Windows: download por link com escolha de qualidade (ou MP3),
            pesquisa no YouTube e SoundCloud, histórico com "baixar de novo", **player embutido** (aba ▶ Player),
            estilos Clássico, Cyberpunk, Retrô e Steampunk, tema claro/escuro/sistema e vídeos com restrição de idade via cookies.txt.
            Extras do celular: botão **Compartilhar → Baixador de Vídeos** em qualquer app, sugestão ao copiar
            um link e downloads que continuam em segundo plano.

            ### Novidades
            - **Novo estilo Steampunk:** latão, cobre e madeira, com engrenagens e rebites. Escolha em ⚙ › Estilo visual.
            - Quem está na 1.4.0 pode atualizar direto pelo app, em ⚙ › Atualizações do aplicativo (mantém o histórico).
              Versões beta anteriores à 1.4.0 precisam ser desinstaladas uma vez antes.

            ### Qual arquivo baixar?
            - **arm64**: funciona na grande maioria dos celulares (de 2017 para cá).
            - **armv7**: só para celulares muito antigos.
            - **x86_64**: emuladores e Chromebooks.

            ### Como instalar
            1. Baixe o APK no celular e toque nele.
            2. Se o Android pedir, permita **instalar apps desta fonte**.
            3. Na primeira abertura o app prepara e atualiza o motor de download (precisa de internet, leva alguns segundos).

            Os vídeos ficam em **Download/BaixadorDeVideos**. Produzido por Lagaz.
